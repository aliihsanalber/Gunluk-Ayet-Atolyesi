<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
  /* Arapça fontlar (yerel): HafsUthmanic = KFGQPC HAFS Uthmanic Script (1.jpeg referansı),
     AdobeNaskh = Adobe Naskh Medium (alternatif). render.js __ARFONT__ ile seçer. */
  @font-face {
    font-family: 'HafsUthmanic';
    src: url('fonts/HafsUthmanicScript-Regular.otf') format('opentype');
    font-weight: 400;
    font-display: block;
  }
  @font-face {
    font-family: 'AdobeNaskh';
    src: url('fonts/AdobeNaskh-Medium.otf') format('opentype');
    font-weight: 400;
    font-display: block;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { margin: 0; background: #ffffff; }

  /* Kart yüksekliği sabit DEĞİL: fit() içeriğe göre MIN_H–MAX_H aralığında ayarlar */
  .card {
    width: 1080px; height: 1920px;
    position: relative;
    display: flex; flex-direction: column;
    overflow: hidden;
    background: radial-gradient(130% 95% at 50% 8%, #faf5e8 0%, #f5eedb 48%, #eee5cd 100%);
  }
  .head { padding: 74px 60px 0; display: flex; flex-direction: column; align-items: center; gap: 24px; }
  .star { width: 46px; height: 46px; }
  .title {
    font-family: Lora, Georgia, serif;
    font-weight: 700; font-size: 56px;
    color: #a5821f; letter-spacing: 0.015em;
    text-align: center;
  }
  /* Besmele — her kartta başlığın hemen altında sabit */
  .besmele {
    direction: rtl;
    font-family: __ARFONT__, 'Noto Naskh Arabic', serif;
    font-size: 47px; line-height: 1.5;
    color: #29573c;
    text-align: center;
  }
  .content {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px 92px 96px;
    gap: 1.05em;
    font-size: 64px; /* taban — fit() ölçekler */
    overflow: hidden;
  }
  .arabic {
    direction: rtl;
    font-family: __ARFONT__, 'Noto Naskh Arabic', serif;
    font-size: 0.95em; line-height: 1.8;
    text-align: center; color: #29573c;
    width: 100%;
  }
  /* Her ayet + rozeti tek blok: numara asla ayetten kopmaz */
  .ayah { display: block; }
  /* Ayet sonu numarası: fontun kendi süslü parantezleri ﴿N﴾ (1.jpeg örneği gibi) */
  .badge {
    white-space: nowrap;
    margin-inline-start: 0.18em;
  }
  .sep { width: 30%; border-top: 2px solid rgba(150, 118, 52, 0.38); }
  .meal {
    font-family: Lora, Georgia, serif;
    font-style: italic;
    font-size: 0.66em; line-height: 1.66; font-weight: 500;
    text-align: center; color: #33614a;
    text-wrap: balance;
  }
  .part-chip {
    position: absolute; bottom: 48px; right: 62px;
    font-family: 'Segoe UI', sans-serif;
    font-weight: 700; font-size: 29px; letter-spacing: 0.12em;
    color: #8a6d1c;
    background: rgba(255, 253, 246, 0.6);
    border: 2px solid rgba(165, 130, 31, 0.5);
    padding: 10px 30px;
    border-radius: 999px;
  }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="head">
    <svg class="star" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 2.6l2.8 6.05 6.4.58-4.83 4.25 1.43 6.28L12 16.44l-5.8 3.32 1.43-6.28L2.8 9.23l6.4-.58L12 2.6z" stroke="#b4932f" stroke-width="1.3" stroke-linejoin="round"/></svg>
    <div class="title" id="source">__SOURCE__</div>
    <div class="besmele" dir="rtl">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
  </div>
  <div class="content">
    <p class="arabic" id="arabic" dir="rtl">__ARABIC__</p>
    <div class="sep"></div>
    <p class="meal" id="meal">__MEAL__</p>
  </div>
  <div class="part-chip" id="part" style="__PART_STYLE__">__PART__</div>
</div>
<script>
  /* Dinamik punto: içerik karta sığacak şekilde ölçeklenir.
     - CAP: punto tavanı — kısa ayetlerde aşırı irileşme olmasın (Arabic ≈ ≤76px)
     - FLOOR: okunabilirlik tabanı (Arabic ≈ ≥46px)
     - Punto tavanda bile kart boş kalırsa kart KENDİ yüksekliğini kısaltır (MIN_H–MAX_H) */
  (function () {
    var BASE = 64, FLOOR = 0.76, CAP = 1.25, MIN_H = 1400, MAX_H = 1920;
    var card = document.getElementById('card');
    var c = document.querySelector('.content');
    var arabicEl = document.getElementById('arabic');

    function badgeOrphan() {
      var lh = parseFloat(getComputedStyle(arabicEl).lineHeight);
      var ayahs = arabicEl.querySelectorAll('.ayah');
      for (var i = 0; i < ayahs.length; i++) {
        var badge = ayahs[i].querySelector('.badge');
        if (!badge || !ayahs[i].childNodes[0]) continue;
        var range = document.createRange();
        range.selectNodeContents(ayahs[i].childNodes[0]);
        var rects = range.getClientRects();
        if (!rects.length) continue;
        var lastText = rects[rects.length - 1];
        var br = badge.getBoundingClientRect();
        if (br.top > lastText.top + lh * 0.6) return true;
      }
      return false;
    }

    function fit() {
      card.style.height = MAX_H + 'px';
      var chosen = null;
      /* Büyükten küçüğe tara: kısıtları (sığma + rozet kopuk değil) sağlayan
         EN BÜYÜK ölçeği bul. Rozet kısıtı tektonik olmadığı için doğrusal tarama. */
      for (var t = CAP; t >= FLOOR - 1e-9; t -= 0.02) {
        c.style.fontSize = (BASE * t) + 'px';
        if (c.scrollHeight <= c.clientHeight + 2 && !badgeOrphan()) { chosen = t; break; }
      }
      if (chosen === null) {
        chosen = FLOOR;
        c.style.fontSize = (BASE * FLOOR) + 'px';
        card.dataset.overflow = '1'; /* render.js uyarı basar — ayet bölünmeli */
      }
      /* Kartı içeriğe göre kısalt: fazla üst/alt boşluk kalmasın.
         (scrollHeight clientHeight'tan küçük döndüğü için doğal yükseklik
         height:auto ile ölçülür.) */
      card.style.height = 'auto';
      var need = card.offsetHeight;
      card.style.height = Math.max(MIN_H, Math.min(MAX_H, need)) + 'px';
    }
    fit();
    if (document.fonts && document.fonts.ready) { document.fonts.ready.then(fit); }
  })();
</script>
</body>
</html>
